name: Run Gradle on PRs
on:
  push:
    branches: [ main]
jobs:
  build:
    strategy:
      matrix:
        include:
          - distribution: corretto
            java-version: 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java-version }}
      - name: Process Watcher 
        uses: cdsap/build-process-watcher@ingest-data
        with:
           remote_monitoring: true          
      - name: Execute Gradle build (1)
        run: ./gradlew assembleDebug -Dscan.tag.H${{ matrix.java-version }}-${{ matrix.distribution }} -Dscan.tag.3_0_1
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          AGENT_JAVA_VERSION: "${{ matrix.java-version }}-${{ matrix.distribution }}"
    continue-on-error: true
